<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <!-- Background: layered mesh-like gradient + noise simulation -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1115"/>
      <stop offset="0.5" stop-color="#0A0B0F"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#6B5BFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6B5BFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.82" cy="0.78" r="0.45">
      <stop offset="0" stop-color="#FF7A59" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow3" cx="0.65" cy="0.18" r="0.35">
      <stop offset="0" stop-color="#39E0C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39E0C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle film-grain via tiny circles -->
    <pattern id="grain" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.3" fill="#FFFFFF" fill-opacity="0.04"/>
      <circle cx="3" cy="3" r="0.3" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <rect width="1280" height="640" fill="url(#glow3)"/>
  <rect width="1280" height="640" fill="url(#grain)"/>

  <!-- Brand wordmark -->
  <g transform="translate(80, 156)">
    <text font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="92" font-weight="800" letter-spacing="-3" fill="#FFFFFF">heyimjames</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 226)">
    <text font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="34" font-weight="500" letter-spacing="-0.5" fill="#FFFFFF" fill-opacity="0.72">
      iOS Design Engineering Skills
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 286)">
    <text font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
          font-size="20" font-weight="400" letter-spacing="0" fill="#FFFFFF" fill-opacity="0.5">
      The final 5% of polish that separates a competent iOS app from a beloved one.
    </text>
  </g>

  <!-- Pills row -->
  <g transform="translate(80, 360)">
    <g transform="translate(0, 0)">
      <rect width="270" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="30" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="600" fill="#FFFFFF">heyimjames:camera-and-photos</text>
    </g>
    <g transform="translate(288, 0)">
      <rect width="280" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="30" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="600" fill="#FFFFFF">heyimjames:chat-and-messaging</text>
    </g>
  </g>

  <g transform="translate(80, 420)">
    <g transform="translate(0, 0)">
      <rect width="310" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="30" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="600" fill="#FFFFFF">heyimjames:interaction-primitives</text>
    </g>
    <g transform="translate(328, 0)">
      <rect width="290" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="30" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="600" fill="#FFFFFF">heyimjames:the-final-5-percent</text>
    </g>
  </g>

  <!-- Install command pill -->
  <g transform="translate(80, 510)">
    <rect width="920" height="68" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="24" y="32" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
          font-size="12" font-weight="500" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.5">
      INSTALL IN CLAUDE CODE
    </text>
    <text x="24" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="18" font-weight="500" fill="#FFFFFF">
      /plugin marketplace add heyimjames/ios-design-skills
    </text>
  </g>
</svg>
